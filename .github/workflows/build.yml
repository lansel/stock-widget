name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and run selftests
        shell: pwsh
        run: ./build.ps1

      - name: Upload widget exe
        uses: actions/upload-artifact@v4
        with:
          name: StockWidget
          path: bin/StockWidget.exe

      - name: Attach release files
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/StockWidget.exe
            stocks.txt.sample
